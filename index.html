    <style>
      /* loading skeleton shown until the app has started (replaced by React) */
      .sk { max-width: 28rem; margin: 0 auto; padding: 14px 16px; font-family: system-ui, sans-serif; }
      .sk i { display: block; background: #e5e5e5; border-radius: 16px; animation: sk 1.2s ease-in-out infinite alternate; }
      .sk-dark { background: #131f24; min-height: 100vh; }
      .sk-dark i { background: #2b3a41; }
      .sk-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
      .sk-node { width: 72px; height: 72px; border-radius: 50% !important; margin: 22px auto 0; }
      .sk-nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around; padding: 12px 8px; }
      .sk p { margin: 26px 0 0; text-align: center; font-weight: 700; color: #9a9a9a; }
      @keyframes sk { from { opacity: 1; } to { opacity: 0.45; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="sk" id="sk" aria-busy="true">
        <div class="sk-row"><i style="width: 110px; height: 34px"></i><i style="width: 150px; height: 34px"></i></div>
        <i style="height: 64px; margin-top: 18px"></i>
        <i style="height: 26px; width: 60%; margin-top: 22px"></i>
        <i class="sk-node"></i>
        <i class="sk-node" style="transform: translateX(44px)"></i>
        <i class="sk-node" style="transform: translateX(70px)"></i>
        <i class="sk-node" style="transform: translateX(44px)"></i>
        <p>Đang tải Gấu Trúc Xanh…</p>
        <div class="sk-nav"><i style="width: 44px; height: 44px"></i><i style="width: 44px; height: 44px"></i><i style="width: 44px; height: 44px"></i><i style="width: 44px; height: 44px"></i></div>
      </div>
      <script>
        try {
          if (/"dark":true/.test(localStorage.getItem('hoc-tieng-trung-progress-v1') || '')) document.getElementById('sk').className += ' sk-dark';
        } catch (e) {}
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
